name: build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleRelease --no-daemon

      # Each APK is uploaded as its own unzipped artifact (archive: false).
      # The artifact name is taken from the file name, so "name" is not needed.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-universal-release.apk
          archive: false
          if-no-files-found: error